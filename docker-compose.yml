services:
  mysql_db:
    image: mysql:8.0
    container_name: belaaktun_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: becal_db
      MYSQL_USER: becal_user
      MYSQL_PASSWORD: becal_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./becal-backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build: ./becal-backend
    container_name: belaaktun_flask
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: mysql_db
      DB_USER: becal_user
      DB_PASSWORD: becal_pass
      DB_NAME: becal_db
    depends_on:
      - mysql_db

volumes:
  mysql_data: