<div class="modal-backdrop">
  <div class="modal-card">
    <div class="modal-header">
      <h3>Reservar Visita: {{ nombreTaller }}</h3>
      <button class="btn-close" (click)="cancelar()">✕</button>
    </div>

    <div *ngIf="exito" class="alert-success">
      ¡Reserva enviada con éxito! El artesano confirmará tu visita pronto.
    </div>

    <form *ngIf="!exito" (ngSubmit)="enviarReserva()" #reservaForm="ngForm">
      <div class="form-group">
        <label>Nombre Completo</label>
        <input type="text" [(ngModel)]="nuevaReserva.nombre_visitante" name="nombre" required placeholder="Ej. Ana Martínez">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" [(ngModel)]="nuevaReserva.email_visitante" name="email" required placeholder="ana@email.com">
        </div>
        <div class="form-group">
          <label>Teléfono (WhatsApp)</label>
          <input type="tel" [(ngModel)]="nuevaReserva.telefono_visitante" name="telefono" required placeholder="529991234567">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Fecha</label>
          <input type="date" [(ngModel)]="nuevaReserva.fecha_reserva" name="fecha" required>
        </div>
        <div class="form-group">
          <label>Hora de Visita</label>
          <input type="time" [(ngModel)]="nuevaReserva.hora_reserva" name="hora" required>
        </div>
        <div class="form-group">
          <label>Personas</label>
          <input type="number" [(ngModel)]="nuevaReserva.numero_personas" name="personas" min="1" max="15" required>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" (click)="cancelar()">Cancelar</button>
        <button type="submit" class="btn-primary" [disabled]="!reservaForm.valid">Confirmar Reserva</button>
      </div>
    </form>
  </div>
</div>
